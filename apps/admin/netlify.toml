# Netlify config for the admin dashboard (admin.calabasascoffeehouse.com).
# See apps/shop/netlify.toml for the full explanation of why the command is
# workspace-scoped and why publish must be set explicitly.

[build]
  command = "npm run build --workspace=@cch/admin"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
