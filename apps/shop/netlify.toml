# Netlify config for the storefront (shop.calabasascoffeehouse.com).
#
# In the Netlify UI set "Base directory" = apps/shop. The command and publish
# values below take precedence over anything in the UI, so those fields can be
# left as-is.
#
# Two things this file exists to prevent, both learned the hard way:
#
#   1. Do NOT set NPM_FLAGS="--prefix=..". Netlify detects npm workspaces
#      natively; a prefix resolves from the repo root, escapes to /opt, and
#      fails with EACCES on /opt/package-lock.json.
#   2. The build command must be workspace-scoped, because Netlify executes it
#      from the repo root even though it reads this file from apps/shop.

[build]
  # Netlify runs this from the REPO ROOT (/opt/build/repo), not from the base
  # directory — the log line "Current directory: /opt/build/repo" with
  # "packagePath: apps/shop" confirms it. A bare `npm run build` therefore hits
  # the root package.json, which has no build script. Scope it to the workspace.
  command = "npm run build --workspace=@cch/shop"
  # Relative to the base directory (baseRelDir: true) -> apps/shop/.next
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; img-src 'self' data: https://qthptztogfcufabviyrx.supabase.co; style-src 'self' 'unsafe-inline'; connect-src 'self' https://qthptztogfcufabviyrx.supabase.co https://api.stripe.com; font-src 'self' data:"
