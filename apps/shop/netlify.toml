# Netlify config for the storefront (shop.calabasascoffeehouse.com).
#
# Set ONLY "Base directory" = apps/shop in the Netlify UI. Leave build command
# and publish directory BLANK there.
#
# Nothing here sets `command` or `publish` on purpose: Netlify auto-detects
# Next.js and applies `npm run build` with a `.next` publish dir relative to the
# base directory. Specifying them in both places compounds the paths into
# apps/shop/apps/shop/.next and the build fails.
#
# Do NOT add NPM_FLAGS="--prefix=..". Netlify detects npm workspaces natively;
# a prefix resolves from the repo root and escapes to /opt (EACCES).

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; img-src 'self' data: https://qthptztogfcufabviyrx.supabase.co; style-src 'self' 'unsafe-inline'; connect-src 'self' https://qthptztogfcufabviyrx.supabase.co https://api.stripe.com; font-src 'self' data:"
